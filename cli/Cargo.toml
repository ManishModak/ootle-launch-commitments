[package]
name = "launch-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Key file, indexer session and the dry-run-then-submit runner, shared with lockbox-cli. Pinned to a
# pushed commit of the public Lockbox repo so a fresh clone builds; bump `rev` to pick up changes.
lockbox-cli = { git = "https://github.com/ManishModak/ootle-lockbox", rev = "c938278dacb1c5fb4f6a44d34421eb3243ddcd1f" }
ootle-rs = "0.32"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
tari_crypto = "0.24"
tari_ootle_transaction = "0.50"
tari_ootle_common_types = "0.50"

[workspace]
