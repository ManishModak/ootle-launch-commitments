[package]
name = "launch-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Key file, indexer session and the dry-run-then-submit runner, shared with lockbox-cli.
lockbox-cli = { path = "../../ootle-lockbox/cli" }
