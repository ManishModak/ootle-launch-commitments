[package]
name = "launch_commitments"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Token factory on Tari Ootle: fixed-supply, rule-frozen tokens with their allocations locked in Lockbox"

[dependencies]
tari_template_lib = "0.38"

[dev-dependencies]
tari_template_test_tooling = "0.50"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The engine is very slow in debug builds; optimise it even for tests.
[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
